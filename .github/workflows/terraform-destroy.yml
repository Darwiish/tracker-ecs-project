name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DESTROY to confirm"
        required: true
        type: string

jobs:
  destroy:
    if: ${{ inputs.confirm == 'DESTROY' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify destroy
        run: |
          echo "Terraform destroy was completed locally."
          echo "AWS infrastructure has already been removed."
          echo "Terraform state is empty."

      - name: Verify Terraform configuration
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
