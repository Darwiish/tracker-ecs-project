name: Terraform Destroy Pipeline

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DESTROY to confirm infrastructure destruction
        required: true
        type: string

permissions:
  id-token: write # Enable AWS OIDC authentication
  contents: read # Allow repository checkout

jobs:
  destroy:
    name: Destroy Infrastructure
    runs-on: ubuntu-latest

    env:
      AWS_REGION: eu-north-1
      AWS_ROLE_ARN: arn:aws:iam::224084343617:role/github-actions-ecs-deploy

    steps:
      # Require explicit confirmation before destruction
      - name: Verify Destruction Confirmation
        if: ${{ inputs.confirm != 'DESTROY' }}
        run: |
          echo "Invalid confirmation."
          echo "Type DESTROY to continue."
          exit 1

      # Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Authenticate without static AWS credentials
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Install the required Terraform version
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      # Initialize Terraform and configure the backend
      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      # Destroy the Terraform-managed infrastructure
      - name: Terraform Destroy
        working-directory: terraform
        run: terraform destroy -auto-approve
