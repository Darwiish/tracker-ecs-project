name: Terraform Pipeline

on:
  workflow_dispatch:
    inputs:
      backend_image_digest:
        description: Backend ECR image digest
        required: true
        type: string
      frontend_image_digest:
        description: Frontend ECR image digest
        required: true
        type: string

concurrency:
  group: terraform-main
  cancel-in-progress: true

permissions:
  id-token: write # Enable AWS OIDC authentication
  contents: read # Allow repository checkout

jobs:
  terraform:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest

    env:
      AWS_REGION: eu-north-1
      AWS_ROLE_ARN: arn:aws:iam::224084343617:role/github-actions-ecs-deploy
      TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}

    steps:
      # Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Authenticate without static AWS credentials
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Install the required Terraform version
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.0

      # Initialize Terraform and configure the backend
      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      # Apply infrastructure with the published image digests
      - name: Terraform Apply
        working-directory: terraform
        run: |
          terraform apply \
            -auto-approve \
            -var="backend_image_digest=${{ inputs.backend_image_digest }}" \
            -var="frontend_image_digest=${{ inputs.frontend_image_digest }}"
