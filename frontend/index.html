<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevOps Project Tracker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="toastBar"></div>
    <div class="container">
      <div class="app-header">
        <svg
          class="logo"
          viewBox="0 0 400 400"
          xmlns="http://www.w3.org/2000/svg"
        >
          <g
            fill="none"
            stroke="#2563eb"
            stroke-width="16"
            stroke-linejoin="round"
          >
            <path
              d="M200 40 c14 0 28 2 41 6 l4 28 c10 4 19 9 27 15 l26 -12 c20 16 36 36 47 59 l-18 22 c3 10 5 20 5 30 s-2 20 -5 30 l18 22 c-11 23 -27 43 -47 59 l-26 -12 c-8 6 -17 11 -27 15 l-4 28 c-13 4 -27 6 -41 6 s-28 -2 -41 -6 l-4 -28 c-10 -4 -19 -9 -27 -15 l-26 12 c-20 -16 -36 -36 -47 -59 l18 -22 c-3 -10 -5 -20 -5 -30 s2 -20 5 -30 l-18 -22 c11 -23 27 -43 47 -59 l26 12 c8 -6 17 -11 27 -15 l4 -28 c13 -4 27 -6 41 -6z"
            />
            <circle cx="200" cy="188" r="78" />
          </g>
          <text
            x="200"
            y="210"
            text-anchor="middle"
            font-family="Arial, sans-serif"
            font-size="72"
            font-weight="bold"
            fill="#2563eb"
          >
            DT
          </text>
        </svg>
        <h1>DevOps Project Tracker</h1>
      </div>

      <!-- Auth section: Login & Registration -->
      <div id="authSection">
        <h2 id="authTitle">Login</h2>
        <input type="email" id="authEmail" placeholder="Email" />
        <input type="password" id="authPassword" placeholder="Password" />
        <button id="authSubmitBtn">Login</button>
        <p class="auth-toggle">
          <span id="authToggleText">Don't have an account?</span>
          <a href="#" id="authToggleLink">Register</a>
        </p>
        <p id="authError" class="error"></p>
      </div>

      <!-- Main application dashboard -->
      <div id="appSection" style="display: none">
        <div class="user-bar">
          <div class="user-info">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <circle
                cx="12"
                cy="8"
                r="4"
                stroke="currentColor"
                stroke-width="2"
              />
              <path
                d="M4 20c0-4 4-6 8-6s8 2 8 6"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
            <span id="userEmailDisplay"></span>
          </div>
          <!-- Dark mode toggle and logout controls -->
          <div class="user-actions">
            <button id="darkModeToggle" class="theme-btn">🌙 Dark Mode</button>
            <button id="logoutBtn">Logout</button>
          </div>
        </div>

        <!-- Completion progress indicator -->
        <div class="progress-container">
          <div id="progressBar" class="progress-bar"></div>
        </div>

        <div id="statsBar" class="stats-bar"></div>

        <div class="filter-tabs">
          <button class="filter-btn active" data-filter="All">All</button>
          <button class="filter-btn" data-filter="Todo">Todo</button>
          <button class="filter-btn" data-filter="In Progress">
            In Progress
          </button>
          <button class="filter-btn" data-filter="Done">Done</button>
        </div>

        <div class="view-toggle">
          <button id="tableViewBtn" class="view-btn active">Table View</button>
          <button id="boardViewBtn" class="view-btn">Board View</button>
        </div>

        <!-- New Task Creation Form -->
        <div class="add-task">
          <input type="text" id="taskInput" placeholder="Task Name" />
          <input type="date" id="dueDateInput" />

          <select id="priorityInput">
            <option value="Low">Low Priority</option>
            <option value="Medium" selected>Medium Priority</option>
            <option value="High">High Priority</option>
          </select>

          <select id="categoryInput">
            <option value="General">General</option>
            <option value="Backend">Backend</option>
            <option value="Frontend">Frontend</option>
            <option value="AWS">AWS</option>
            <option value="Docker">Docker</option>
            <option value="Terraform">Terraform</option>
            <option value="CI/CD">CI/CD</option>
          </select>

          <button id="addTaskBtn">Add Task</button>
        </div>

        <h2>Current Tasks</h2>
        <input type="text" id="searchInput" placeholder="Search tasks..." />

        <!-- Interactive sortable task table -->
        <table id="taskTable">
          <thead>
            <tr>
              <th class="sortable" data-sort="name">
                Task <span class="sort-icon">↕</span>
              </th>
              <th class="sortable" data-sort="category">
                Category <span class="sort-icon">↕</span>
              </th>
              <th class="sortable" data-sort="priority">
                Priority <span class="sort-icon">↕</span>
              </th>
              <th class="sortable" data-sort="due_date">
                Due Date <span class="sort-icon">↕</span>
              </th>
              <th class="sortable" data-sort="status">
                Status <span class="sort-icon">↕</span>
              </th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="taskList"></tbody>
        </table>

        <!-- Drag-and-drop Kanban Board View -->
        <div id="boardView" class="board-view" style="display: none">
          <div class="board-column" data-status="Todo">
            <h3>Todo <span class="column-count" id="countTodo">0</span></h3>
            <div class="column-cards" id="cardsTodo"></div>
          </div>
          <div class="board-column" data-status="In Progress">
            <h3>
              In Progress
              <span class="column-count" id="countInProgress">0</span>
            </h3>
            <div class="column-cards" id="cardsInProgress"></div>
          </div>
          <div class="board-column" data-status="Done">
            <h3>Done <span class="column-count" id="countDone">0</span></h3>
            <div class="column-cards" id="cardsDone"></div>
          </div>
        </div>

        <div id="paginationBar" class="pagination-bar"></div>
      </div>
    </div>

    <!-- Edit Task Modal Overlay -->
    <div id="editModal" class="modal">
      <div class="modal-content">
        <h3>Edit Task Details</h3>
        <form id="editTaskForm">
          <input type="hidden" id="editTaskId" />
          <label for="editTaskName">Task Name</label>
          <input type="text" id="editTaskName" required />

          <label for="editDueDate">Due Date</label>
          <input type="date" id="editDueDate" />

          <label for="editPriority">Priority</label>
          <select id="editPriority">
            <option value="Low">Low</option>
            <option value="Medium">Medium</option>
            <option value="High">High</option>
          </select>

          <label for="editCategory">Category</label>
          <select id="editCategory">
            <option value="General">General</option>
            <option value="Backend">Backend</option>
            <option value="Frontend">Frontend</option>
            <option value="AWS">AWS</option>
            <option value="Docker">Docker</option>
            <option value="Terraform">Terraform</option>
            <option value="CI/CD">CI/CD</option>
          </select>

          <div class="modal-actions">
            <button type="button" id="closeModalBtn" class="secondary-btn">
              Cancel
            </button>
            <button type="submit">Save Changes</button>
          </div>
        </form>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
