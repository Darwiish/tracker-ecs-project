<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>DevOps Project Tracker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="toastBar"></div>
    <div class="container">
      <div class="app-header">
        <svg
          class="logo"
          viewBox="0 0 400 400"
          xmlns="http://www.w3.org/2000/svg"
        >
          <g
            fill="none"
            stroke="#2563eb"
            stroke-width="16"
            stroke-linejoin="round"
          >
            <path
              d="M200 40
                    c14 0 28 2 41 6
                    l4 28 c10 4 19 9 27 15
                    l26 -12
                    c20 16 36 36 47 59
                    l-18 22
                    c3 10 5 20 5 30
                    s-2 20 -5 30
                    l18 22
                    c-11 23 -27 43 -47 59
                    l-26 -12
                    c-8 6 -17 11 -27 15
                    l-4 28
                    c-13 4 -27 6 -41 6
                    s-28 -2 -41 -6
                    l-4 -28
                    c-10 -4 -19 -9 -27 -15
                    l-26 12
                    c-20 -16 -36 -36 -47 -59
                    l18 -22
                    c-3 -10 -5 -20 -5 -30
                    s2 -20 5 -30
                    l-18 -22
                    c11 -23 27 -43 47 -59
                    l26 12
                    c8 -6 17 -11 27 -15
                    l4 -28
                    c13 -4 27 -6 41 -6z"
            />
            <circle cx="200" cy="188" r="78" />
          </g>
          <text
            x="200"
            y="210"
            text-anchor="middle"
            font-family="Arial, sans-serif"
            font-size="72"
            font-weight="bold"
            fill="#2563eb"
          >
            DT
          </text>
        </svg>
        <h1>DevOps Project Tracker</h1>
      </div>

      <!-- Auth section: shown when logged out -->
      <div id="authSection">
        <h2 id="authTitle">Login</h2>
        <input type="email" id="authEmail" placeholder="Email" />
        <input type="password" id="authPassword" placeholder="Password" />
        <button id="authSubmitBtn">Login</button>
        <p class="auth-toggle">
          <span id="authToggleText">Don't have an account?</span>
          <a href="#" id="authToggleLink">Register</a>
        </p>
        <p id="authError" class="error"></p>
      </div>

      <!-- App section: shown when logged in -->
      <div id="appSection" style="display: none">
        <div class="user-bar">
          <div class="user-info">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <circle cx="12" cy="8" r="4" stroke="#555" stroke-width="2" />
              <path
                d="M4 20c0-4 4-6 8-6s8 2 8 6"
                stroke="#555"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
            <span id="userEmailDisplay"></span>
          </div>
          <button id="logoutBtn">Logout</button>
        </div>

        <div id="statsBar" class="stats-bar"></div>

        <div class="filter-tabs">
          <button class="filter-btn active" data-filter="All">All</button>
          <button class="filter-btn" data-filter="Todo">Todo</button>
          <button class="filter-btn" data-filter="In Progress">
            In Progress
          </button>
          <button class="filter-btn" data-filter="Done">Done</button>
        </div>

        <div class="view-toggle">
          <button id="tableViewBtn" class="view-btn active">Table View</button>
          <button id="boardViewBtn" class="view-btn">Board View</button>
        </div>

        <div class="add-task">
          <input type="text" id="taskInput" placeholder="Task Name" />
          <input type="date" id="dueDateInput" />
          <button id="addTaskBtn">Add Task</button>
        </div>

        <h2>Current Tasks</h2>
        <input type="text" id="searchInput" placeholder="Search tasks..." />
        <table id="taskTable">
          <thead>
            <tr>
              <th>Task</th>
              <th>Due Date</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="taskList"></tbody>
        </table>

        <div id="boardView" class="board-view" style="display: none">
          <div class="board-column" data-status="Todo">
            <h3>Todo <span class="column-count" id="countTodo">0</span></h3>
            <div class="column-cards" id="cardsTodo"></div>
          </div>
          <div class="board-column" data-status="In Progress">
            <h3>
              In Progress
              <span class="column-count" id="countInProgress">0</span>
            </h3>
            <div class="column-cards" id="cardsInProgress"></div>
          </div>
          <div class="board-column" data-status="Done">
            <h3>Done <span class="column-count" id="countDone">0</span></h3>
            <div class="column-cards" id="cardsDone"></div>
          </div>
        </div>

        <div id="paginationBar" class="pagination-bar"></div>
      </div>
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
