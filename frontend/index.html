<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>DevOps Project Tracker</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>DevOps Project Tracker</h1>

      <div class="add-task">
        <input type="text" id="taskInput" placeholder="Task Name" />
        <button id="addTaskBtn">Add Task</button>
      </div>

      <h2>Current Tasks</h2>
      <ul id="taskList"></ul>
    </div>

    <script src="app.js"></script>
  </body>
</html>
